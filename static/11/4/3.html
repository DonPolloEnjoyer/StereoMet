
<p class="tc t30px m0 wobr">
    Основные формулы
</p>
<p class="tf t25px m0 wbr">

Пусть r - радиус основания, h - высота, L - длина образующей конуса.

<math>
    <mi>L</mi>
    <mo>=</mo>
    <msqrt>
        <msup>
            <mi>h</mi>
            <mn>2</mn>
        </msup>
        <mo>+</mo>
        <msup>
            <mi>r</mi>
            <mn>2</mn>
        </msup>
    </msqrt>
</math>

Формула для вычисления площади боковой поверхности конуса:
<math style="text-align: center;">
    <msub>
        <mi>S</mi>
        <mtext>бок</mtext>
    </msub>
    <mo>=</mo>
    <mi>π</mi>
    <mi>r</mi>
    <mi>L</mi>
</math>

Площадь полной поверхности конуса:
<math style="text-align: center;">
    <msub>
        <mi>S</mi>
        <mtext>полн</mtext>
    </msub>
    <mo>=</mo>
    <mi>π</mi>
    <mi>r</mi>
    <mo>(</mo>
    <mi>r</mi>
    <mo>+</mo>
    <mi>L</mi>
    <mo>)</mo>
</math>

Объём конуса:
<math>
    <mi>V</mi>
    <mo>=</mo>
    <mfrac class="fracN">
        <mn>1</mn>
        <mn>3</mn>
    </mfrac>
    <mi>S</mi>
    <mi>h</mi>
</math>, где <math><mi>S</mi></math> - площадь основания <math>
    <mo>(</mo>
    <mi>S</mi>
    <mo>=</mo>
    <mi>π</mi>
    <msup>
        <mi>r</mi>
        <mn>2</mn>
    </msup>
    <mo>)</mo>
</math>


</p>
