<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta lang="ru">
    <title>Выбор темы | MathAR</title>
    <link rel="stylesheet" href="../static/style.css">
    <link rel="icon" type="image" href="../static/favicon.ico">
</head>
<body class="main1">
  <script type="module">
    const cWin = document.getElementById("cWin");
    const cSub = document.getElementById("cSub");
    function Wtoosmall(){
      if(cWin.clientWidth * 0.7 <= 800 ){
        cSub.style.width = "800px";
      } else if(cWin.clientWidth * 0.7 > 800) {
        cSub.style.width = "70%";
      }}
    Wtoosmall();
    window.addEventListener("resize", Wtoosmall);
  </script>
  <div class="centerWin" id="cWin" style="height: 88vh;">
  <div class="centerSub" id="cSub" style="
    background-color:rgb(55, 55, 55); justify-content: top; 
    align-items: center;">

    <p class="t1 t40px" style="margin: 50px ;" >Темы {{cl}} класса</p>

    {% for t in spis %}
    <a href="/{{cl}}/{{t[1]}}" class="a1" style="width: 70%; margin-top: 50px;">
      <div class="cl" style="background-color: rgb(69, 69, 69);">
        <p class="tc t30px">{{t[0]}}</p>
      </div>
    </a>
    {% endfor %}
    


  </div>
  </div>

</body>

</html>

<style>

.a1 {
  text-decoration: none;
  color: white;
  display: flex;
  justify-content: center;
}

.tc {
  text-align: center;
  font-family: Arial, sans-serif;
}

.t30px {
  font-size: 30px;
}
.t40px {
  font-size: 40px;
}

.t1 {
  font-family: Arial, sans-serif;
  text-align: left;
  font-size: 40px;
}
.t2 {
  font-family: Arial, sans-serif;
  text-align: left;
  font-size: 30px;
}

.cl {
  display: flex;
  justify-content: center ;
  width: 50%;
  height: max-content;

}

.imgHolder {
  display: flex;
  flex-direction: row;
  justify-content: left;
  height: max-content;
  width: 80%;
  margin-top: 20px;
  margin-bottom: 20px;
}

.main1 {
  background-color: rgb(30, 30, 30);
  color: rgb(255, 255, 255);
  margin: 0px;
}


</style>
