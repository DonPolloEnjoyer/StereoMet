Меньший конус подобен большему с коэффициентом 0,5. Объемы подобных тел относятся как куб коэффициента подобия.
Поэтому объем большего конуса в 8 раз больше объема меньшего конуса, он равен 560 мл. Следовательно, необходимо долить 560 − 70 = 490 мл жидкости.

Ответ: 490.
